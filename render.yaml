services:
  - type: postgres
    name: techgest-db
    plan: basic-256mb
    databaseName: techgest
    user: techgest

  - type: web
    name: techgest
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: techgest-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: techgest-db
          property: connectionString
      - key: UPLOADS_PATH
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: PLATFORM_ADMIN_TOKEN
        generateValue: true
